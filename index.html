<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Antarctic Navigation Decision Support</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
        }

        #header {
            height: 64px;
            padding: 12px 20px;
            background: #16232e;
            border-bottom: 1px solid #344955;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #header h1 {
            margin: 0;
            font-size: 20px;
        }

        #status {
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 6px;
            background: #253746;
        }

        #map {
            height: calc(100vh - 64px);
            width: 100%;
        }

        #panel {
            position: absolute;
            z-index: 1000;
            top: 84px;
            right: 20px;
            width: 370px;
            max-height: calc(100vh - 105px);
            overflow-y: auto;
            background: rgba(18, 29, 38, 0.97);
            border: 1px solid #425563;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        #panel h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 19px;
        }

        .subtitle {
            color: #b8c8d2;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .location-box {
            background: #1d2c36;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .location-title {
            font-weight: bold;
            margin-bottom: 9px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 11px;
            color: #b8c8d2;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 9px;
            border-radius: 5px;
            border: 1px solid #526572;
            background: #101820;
            color: white;
            font-size: 14px;
        }

        input:focus {
            outline: 2px solid #3984c6;
            border-color: #3984c6;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        #routeButton {
            background: #1683c7;
            color: white;
        }

        #routeButton:hover {
            background: #2696db;
        }

        #clearButton {
            background: #344955;
            color: white;
        }

        #routeButton:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .validation {
            color: #ffb3b3;
            background: #522424;
            border-radius: 6px;
            padding: 9px;
            margin-top: 10px;
            font-size: 12px;
            display: none;
        }

        .section {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #354753;
        }

        .route-row {
            padding: 10px;
            margin: 7px 0;
            border-radius: 6px;
            background: #1d2c36;
            font-size: 12px;
        }

        .recommended {
            border: 2px solid #00d084;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 6px 0;
        }

        .value {
            font-weight: bold;
            text-align: right;
        }

        .error {
            background: #5c2020;
            padding: 10px;
            border-radius: 6px;
            color: #ffd4d4;
            font-size: 12px;
        }

        .success {
            background: #205c46;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
        }

        .legend {
            background: rgba(18, 29, 38, 0.92);
            color: white;
            padding: 9px;
            border-radius: 6px;
            line-height: 21px;
        }

        .legend-item {
            display: flex;
            align-items: center;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 7px;
        }

        @media (max-width: 700px) {

            #panel {
                width: calc(100% - 20px);
                right: 10px;
                top: 74px;
            }

            #header h1 {
                font-size: 15px;
            }

            #status {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<div id="header">

    <h1>
        Antarctic Navigation Decision Support System
    </h1>

    <div id="status">
        Connecting to API...
    </div>

</div>

<div id="map"></div>

<div id="panel">

    <h2>Navigation Control</h2>

    <div class="subtitle">
        Enter coordinates within the Antarctic operating region.
        <br>
        Valid latitude: <b>-90° to -50°</b>
        <br>
        Valid longitude: <b>-180° to 180°</b>
    </div>


    <!-- START -->

    <div class="location-box">

        <div class="location-title">
            📍 Start Position
        </div>

        <div class="input-row">

            <div class="input-group">

                <label for="startLat">
                    Latitude
                </label>

                <input
                    id="startLat"
                    type="number"
                    step="0.001"
                    min="-90"
                    max="-50"
                    placeholder="-60.000"
                >

            </div>

            <div class="input-group">

                <label for="startLon">
                    Longitude
                </label>

                <input
                    id="startLon"
                    type="number"
                    step="0.001"
                    min="-180"
                    max="180"
                    placeholder="-60.000"
                >

            </div>

        </div>

    </div>


    <!-- DESTINATION -->

    <div class="location-box">

        <div class="location-title">
            🎯 Destination
        </div>

        <div class="input-row">

            <div class="input-group">

                <label for="endLat">
                    Latitude
                </label>

                <input
                    id="endLat"
                    type="number"
                    step="0.001"
                    min="-90"
                    max="-50"
                    placeholder="-65.000"
                >

            </div>

            <div class="input-group">

                <label for="endLon">
                    Longitude
                </label>

                <input
                    id="endLon"
                    type="number"
                    step="0.001"
                    min="-180"
                    max="180"
                    placeholder="-45.000"
                >

            </div>

        </div>

    </div>


    <button
        id="routeButton"
        disabled
    >
        Optimize Route
    </button>

    <button
        id="clearButton"
    >
        Clear
    </button>

    <div
        id="validation"
        class="validation"
    ></div>

    <div id="routeInfo"></div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API_BASE =
    "http://127.0.0.1:8000";


// ========================================================
// MAP
// ========================================================

const map =
    L.map("map", {

        minZoom: 2,
        maxZoom: 8,

        maxBounds: [
            [-89, -180],
            [-50, 180]
        ],

        maxBoundsViscosity: 1.0,

        worldCopyJump: false

    }).setView(
        [-75, 0],
        3
    );


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 8,
        noWrap: true,
        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);


// ========================================================
// LAYERS
// ========================================================

const icebergLayer =
    L.layerGroup().addTo(map);

const seaIceLayer =
    L.layerGroup().addTo(map);

const routeLayer =
    L.layerGroup().addTo(map);


// ========================================================
// MARKERS
// ========================================================

let startMarker = null;
let endMarker = null;


// ========================================================
// STATUS
// ========================================================

function setStatus(
    message,
    error = false
) {

    const element =
        document.getElementById(
            "status"
        );

    element.textContent =
        message;

    element.style.background =
        error
            ? "#6b2424"
            : "#205c46";
}


// ========================================================
// VALIDATION
// ========================================================

function getCoordinate(
    id
) {

    const value =
        Number(
            document.getElementById(
                id
            ).value
        );

    return value;
}


function validateCoordinates() {

    const startLat =
        getCoordinate(
            "startLat"
        );

    const startLon =
        getCoordinate(
            "startLon"
        );

    const endLat =
        getCoordinate(
            "endLat"
        );

    const endLon =
        getCoordinate(
            "endLon"
        );

    const validation =
        document.getElementById(
            "validation"
        );

    validation.style.display =
        "none";

    if (
        !Number.isFinite(startLat) ||
        !Number.isFinite(startLon) ||
        !Number.isFinite(endLat) ||
        !Number.isFinite(endLon)
    ) {

        validation.textContent =
            "Please enter all four coordinates.";

        validation.style.display =
            "block";

        return false;
    }

    if (
        startLat < -90 ||
        startLat > -50 ||
        endLat < -90 ||
        endLat > -50
    ) {

        validation.textContent =
            "Latitude must be between -90° and -50° for the Antarctic region.";

        validation.style.display =
            "block";

        return false;
    }

    if (
        startLon < -180 ||
        startLon > 180 ||
        endLon < -180 ||
        endLon > 180
    ) {

        validation.textContent =
            "Longitude must be between -180° and 180°.";

        validation.style.display =
            "block";

        return false;
    }

    return true;
}


// ========================================================
// ENABLE BUTTON
// ========================================================

function updateButton() {

    const values = [
        "startLat",
        "startLon",
        "endLat",
        "endLon"
    ];

    const complete =
        values.every(
            id =>
                document.getElementById(
                    id
                ).value !== ""
        );

    document.getElementById(
        "routeButton"
    ).disabled =
        !complete;
}


[
    "startLat",
    "startLon",
    "endLat",
    "endLon"
].forEach(
    id => {

        document.getElementById(
            id
        ).addEventListener(
            "input",
            updateButton
        );

    }
);


// ========================================================
// RISK COLORS
// ========================================================

function riskColor(level) {

    switch (
        String(
            level || ""
        ).toUpperCase()
    ) {

        case "CRITICAL":
            return "#ff0000";

        case "HIGH":
            return "#ff7a00";

        case "MEDIUM":
            return "#ffd000";

        case "LOW":
            return "#00c853";

        default:
            return "#888888";
    }
}


// ========================================================
// LOAD ICEBERGS
// ========================================================

async function loadIcebergs() {

    try {

        const response =
            await fetch(
                `${API_BASE}/icebergs`
            );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        icebergLayer.clearLayers();

        for (
            const iceberg
            of data.icebergs
        ) {

            const lat =
                iceberg.predicted_latitude;

            const lon =
                iceberg.predicted_longitude;

            if (
                lat === null ||
                lon === null
            ) {
                continue;
            }

            const risk =
                iceberg.risk_level ||
                "UNKNOWN";

            const marker =
                L.circleMarker(
                    [lat, lon],
                    {
                        radius: 7,
                        color:
                            riskColor(
                                risk
                            ),
                        fillColor:
                            riskColor(
                                risk
                            ),
                        fillOpacity: 0.85,
                        weight: 2
                    }
                );

            marker.bindPopup(`
                <b>Iceberg:</b>
                ${iceberg.Iceberg}<br>
                <b>Risk:</b>
                ${risk}<br>
                <b>Latitude:</b>
                ${Number(lat).toFixed(3)}<br>
                <b>Longitude:</b>
                ${Number(lon).toFixed(3)}
            `);

            marker.addTo(
                icebergLayer
            );
        }

    } catch (error) {

        console.error(error);

        setStatus(
            "API unreachable",
            true
        );

        showError(
            "Could not load iceberg data. " +
            "Make sure FastAPI is running."
        );
    }
}


// ========================================================
// LOAD SEA ICE
// ========================================================

async function loadSeaIce() {

    try {

        const response =
            await fetch(
                `${API_BASE}/sea-ice`
            );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        seaIceLayer.clearLayers();

        for (
            const point
            of data.sea_ice
        ) {

            const lat =
                point.latitude;

            const lon =
                point.longitude;

            const concentration =
                Number(
                    point.ice_concentration
                );

            if (
                lat === null ||
                lon === null ||
                !Number.isFinite(
                    concentration
                )
            ) {
                continue;
            }

            const circle =
                L.circle(
                    [lat, lon],
                    {
                        radius: 18000,
                        stroke: false,
                        fillColor: "#8fd3ff",
                        fillOpacity:
                            Math.min(
                                0.55,
                                0.08 +
                                concentration *
                                0.47
                            )
                    }
                );

            circle.bindPopup(`
                <b>Sea-ice concentration:</b>
                ${(concentration * 100).toFixed(1)}%
                <br>
                <b>Date:</b>
                ${data.analysis_date}
            `);

            circle.addTo(
                seaIceLayer
            );
        }

    } catch (error) {

        console.error(error);

        showError(
            "Sea-ice overlay could not be loaded."
        );
    }
}


// ========================================================
// ROUTE MARKERS
// ========================================================

function createLocationMarkers(
    startLat,
    startLon,
    endLat,
    endLon
) {

    if (startMarker) {
        map.removeLayer(
            startMarker
        );
    }

    if (endMarker) {
        map.removeLayer(
            endMarker
        );
    }

    startMarker =
        L.marker(
            [startLat, startLon]
        )
        .addTo(map)
        .bindPopup(
            "Start"
        );

    endMarker =
        L.marker(
            [endLat, endLon]
        )
        .addTo(map)
        .bindPopup(
            "Destination"
        );
}


// ========================================================
// OPTIMIZE ROUTE
// ========================================================

document
    .getElementById(
        "routeButton"
    )
    .addEventListener(
        "click",
        optimizeRoute
    );


async function optimizeRoute() {

    if (
        !validateCoordinates()
    ) {
        return;
    }

    const startLat =
        getCoordinate(
            "startLat"
        );

    const startLon =
        getCoordinate(
            "startLon"
        );

    const endLat =
        getCoordinate(
            "endLat"
        );

    const endLon =
        getCoordinate(
            "endLon"
        );

    createLocationMarkers(
        startLat,
        startLon,
        endLat,
        endLon
    );

    routeLayer.clearLayers();

    const info =
        document.getElementById(
            "routeInfo"
        );

    info.innerHTML =
        `<div class="success">
            Running environmental route optimization...
        </div>`;

    const url =
        `${API_BASE}/route/optimize` +
        `?start_lat=${encodeURIComponent(startLat)}` +
        `&start_lon=${encodeURIComponent(startLon)}` +
        `&end_lat=${encodeURIComponent(endLat)}` +
        `&end_lon=${encodeURIComponent(endLon)}`;

    try {

        const response =
            await fetch(url);

        if (!response.ok) {

            const errorData =
                await response.json();

            throw new Error(
                errorData.detail ||
                `HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        drawRoutes(data);

        showRouteSummary(data);

    } catch (error) {

        console.error(error);

        showError(
            "Route optimization failed: " +
            error.message
        );
    }
}


// ========================================================
// DRAW ROUTES
// ========================================================

function drawRoutes(data) {

    routeLayer.clearLayers();

    for (
        const route
        of data.candidate_routes
    ) {

        if (
            !route.geometry ||
            route.geometry.length < 2
        ) {
            continue;
        }

        const coordinates =
            route.geometry.map(
                point => [
                    point.lat,
                    point.lon
                ]
            );

        const recommended =
            route.recommended === true;

        const line =
            L.polyline(
                coordinates,
                {
                    color:
                        recommended
                            ? "#00ff88"
                            : "#ffffff",

                    weight:
                        recommended
                            ? 6
                            : 3,

                    opacity:
                        recommended
                            ? 0.95
                            : 0.28,

                    dashArray:
                        recommended
                            ? null
                            : "8 8"
                }
            );

        line.bindPopup(`
            <b>${route.route}</b>
            <br>
            Distance:
            ${Number(
                route.distance_km
            ).toFixed(1)} km
            <br>
            Minimum clearance:
            ${Number(
                route.minimum_clearance_km
            ).toFixed(1)} km
            <br>
            Sea-ice status:
            ${route.sea_ice_status}
        `);

        line.addTo(
            routeLayer
        );
    }

    // Fit the map around the selected route.
    const bounds =
        [];

    if (startMarker) {
        bounds.push(
            startMarker.getLatLng()
        );
    }

    if (endMarker) {
        bounds.push(
            endMarker.getLatLng()
        );
    }

    if (bounds.length === 2) {

        map.fitBounds(
            L.latLngBounds(bounds),
            {
                padding: [
                    80,
                    80
                ]
            }
        );
    }
}


// ========================================================
// ROUTE SUMMARY
// ========================================================

function showRouteSummary(data) {

    const info =
        document.getElementById(
            "routeInfo"
        );

    let html = `
        <div class="section">
            <div class="stat">
                <span>Analysis date</span>
                <span class="value">
                    ${data.analysis_date}
                </span>
            </div>
        </div>
    `;

    if (
        data.recommended_route
    ) {

        html += `
            <div class="section">

                <div class="success">

                    <b>
                        Recommended route:
                    </b>

                    <br>

                    ${data.recommended_route}

                </div>

            </div>
        `;

    } else {

        html += `
            <div class="section">

                <div class="error">
                    No route could be recommended
                    from the available environmental data.
                </div>

            </div>
        `;
    }


    for (
        const route
        of data.candidate_routes
    ) {

        const recommended =
            route.recommended === true;

        html += `
            <div class="
                route-row
                ${recommended
                    ? "recommended"
                    : ""}
            ">

                <b>
                    ${route.route}
                    ${recommended
                        ? " ⭐"
                        : ""}
                </b>

                <div class="stat">
                    <span>Distance</span>
                    <span class="value">
                        ${Number(
                            route.distance_km
                        ).toFixed(1)} km
                    </span>
                </div>

                <div class="stat">
                    <span>Min clearance</span>
                    <span class="value">
                        ${Number(
                            route.minimum_clearance_km
                        ).toFixed(1)} km
                    </span>
                </div>

                <div class="stat">
                    <span>Critical</span>
                    <span class="value">
                        ${route.critical_encounters}
                    </span>
                </div>

                <div class="stat">
                    <span>High</span>
                    <span class="value">
                        ${route.high_encounters}
                    </span>
                </div>

                <div class="stat">
                    <span>Medium</span>
                    <span class="value">
                        ${route.medium_encounters}
                    </span>
                </div>

                <div class="stat">
                    <span>Mean sea ice</span>
                    <span class="value">
                        ${
                            route.mean_ice_concentration === null
                                ? "N/A"
                                :
                                (
                                    Number(
                                        route.mean_ice_concentration
                                    ) * 100
                                ).toFixed(1) + "%"
                        }
                    </span>
                </div>

                <div class="stat">
                    <span>Sea-ice coverage</span>
                    <span class="value">
                        ${
                            route.sea_ice_coverage_percent === null
                                ? "N/A"
                                :
                                Number(
                                    route.sea_ice_coverage_percent
                                ).toFixed(0) + "%"
                        }
                    </span>
                </div>

                <div class="stat">
                    <span>Final score</span>
                    <span class="value">
                        ${
                            route.total_score === null
                                ? "N/A"
                                :
                                Number(
                                    route.total_score
                                ).toFixed(2)
                        }
                    </span>
                </div>

            </div>
        `;
    }

    info.innerHTML =
        html;
}


// ========================================================
// ERROR
// ========================================================

function showError(
    message
) {

    document.getElementById(
        "routeInfo"
    ).innerHTML =
        `<div class="error">
            ${message}
        </div>`;
}


// ========================================================
// CLEAR
// ========================================================

document
    .getElementById(
        "clearButton"
    )
    .addEventListener(
        "click",
        function() {

            document.getElementById(
                "startLat"
            ).value = "";

            document.getElementById(
                "startLon"
            ).value = "";

            document.getElementById(
                "endLat"
            ).value = "";

            document.getElementById(
                "endLon"
            ).value = "";

            routeLayer.clearLayers();

            if (startMarker) {
                map.removeLayer(
                    startMarker
                );
                startMarker = null;
            }

            if (endMarker) {
                map.removeLayer(
                    endMarker
                );
                endMarker = null;
            }

            document.getElementById(
                "routeInfo"
            ).innerHTML = "";

            document.getElementById(
                "validation"
            ).style.display =
                "none";

            updateButton();

            map.setView(
                [-75, 0],
                3
            );
        }
    );


// ========================================================
// INITIALIZE
// ========================================================

async function initialize() {

    try {

        const response =
            await fetch(
                `${API_BASE}/`
            );

        if (!response.ok) {
            throw new Error();
        }

        setStatus(
            "API online"
        );

        await loadIcebergs();

        await loadSeaIce();

        updateButton();

    } catch (error) {

        console.error(error);

        setStatus(
            "API unreachable",
            true
        );

        showError(
            "Backend API is not running. " +
            "Start it with: " +
            "py -3.12 -m uvicorn api.main:app --reload"
        );
    }
}


initialize();

</script>

</body>
</html>
